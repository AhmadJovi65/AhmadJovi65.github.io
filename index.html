<!DOCTYPE html>
<html lang="en" data-type="service">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jovi | Game Artist: 3D Environments, VFX and Game UI</title>
<meta name="description" content="Portfolio of Jovi, a game artist working in 3D environment art, game VFX and UI/UX. Tools: Blender, Substance Painter, Unity, After Effects.">
<meta name="page-type" content="service">
<meta name="site-kind" content="other">
<meta name="theme-color" content="#0e0e0e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e0e0e'/%3E%3Crect x='8' y='8' width='16' height='16' fill='%23c6ff3d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   COLOUR PALETTE: change the hex values here, the whole site follows.
   ========================================================== */
:root{
  --bg:#0e0e0e;        /* page background (60%) */
  --card:#171717;      /* windows, cards (30%) */
  --card-2:#1e1e1e;    /* placeholder blocks */
  --text:#f2f2f2;
  --muted:#8c8c8c;
  --accent:#c6ff3d;    /* the one accent (10%) */
  --accent-ink:#0e0e0e;/* text on top of the accent */
  --line:#262626;      /* 1px borders */
  --line-hover:#3a3a3a;
  --radius:6px;
  --tint:color-mix(in srgb,var(--accent) 10%,transparent);   /* ambient background glow */
  --grid:color-mix(in srgb,var(--text) 2.5%,transparent);     /* faint background grid */
  --glow:color-mix(in srgb,var(--accent) 32%,transparent);  /* hover light */
  --ease:cubic-bezier(.16,1,.3,1);
  --tool-icon:40px;    /* software logo size (About section) */
  --tool-w:104px;      /* smallest width of a software tile (tiles stretch to fill the row) */
  --bg-top:color-mix(in srgb,var(--text) 5%,var(--bg));    /* lighter at the top of the page */
  --bg-bottom:color-mix(in srgb,#000 60%,var(--bg));       /* darker towards the bottom */
  --shadow:0 1px 3px rgba(0,0,0,.4);
  --font-head:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{position:relative;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--font-body);-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--font-head);font-weight:600;line-height:1.1;letter-spacing:-.02em}
h2{font-size:clamp(28px,4vw,44px)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.skip{position:absolute;left:16px;top:-60px;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:var(--radius);z-index:10;transition:top 150ms}
.skip:focus{top:12px}
.wrap{width:min(1120px,100% - 48px);margin-inline:auto}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{font:600 18px var(--font-head);text-decoration:none}
nav{display:flex;gap:4px}
nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 12px;color:var(--muted);text-decoration:none;font-size:15px;transition:color 200ms}
nav a::after{content:"";position:absolute;left:12px;right:12px;bottom:8px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform 200ms}
nav a:hover{color:var(--text)}
nav a:hover::after{transform:scaleX(1)}

/* buttons */
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:var(--radius);background:var(--accent);color:var(--accent-ink);font:500 16px var(--font-body);text-decoration:none;border:0;cursor:pointer;transition:transform 150ms,filter 150ms}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.link{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;color:var(--text);text-decoration:none;background:var(--card);border:1px solid var(--line-hover);border-radius:var(--radius);transition:transform 200ms var(--ease),border-color 200ms,color 200ms}
.link::after{content:"";position:absolute;inset:-5px;pointer-events:none;border:1px solid var(--accent);border-radius:calc(var(--radius) + 5px);opacity:0;transform:scale(.96);transition:opacity 200ms var(--ease),transform 200ms var(--ease)}
.link:hover{transform:translateY(-2px);border-color:var(--accent);color:var(--accent)}
.link:hover::after{opacity:.5;transform:scale(1)}
.link:active{transform:translateY(1px)}

/* hero: alone on the first screen */
.hero{min-height:calc(100svh - 64px);display:flex;align-items:center;padding-bottom:8vh}
.hero .eyebrow{color:var(--accent);font:500 16px var(--font-body)}
.hero h1{font-size:clamp(40px,7.4vw,92px);max-width:14ch;margin:20px auto 24px}
.hero p{color:var(--muted);max-width:52ch;margin-inline:auto;font-size:18px}
.hero .row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center;margin-top:40px}
[data-enter]{animation:rise 300ms var(--ease) backwards;animation-delay:calc(var(--d,0) * 50ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

section.block{padding:96px 0}
section.block>.wrap>h2{margin-bottom:12px}
.lede{color:var(--muted);max-width:56ch;margin-bottom:40px}

/* category windows: the lead one is big, the other two are equal and smaller */
.wins{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.win{order:1;display:flex;flex-direction:column;min-height:280px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);text-decoration:none;position:relative;isolation:isolate;transition:transform 200ms,border-color 200ms}
.win.lead{order:0;grid-column:1/-1;min-height:clamp(360px,64vh,580px)}
.win:hover{transform:translateY(-4px);border-color:var(--accent)}
.win-art{flex:1;min-height:140px;background:var(--card-2);overflow:hidden;border-radius:calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0}
.win-art img{width:100%;height:100%;object-fit:cover;transition:transform 300ms}
.win:hover .win-art img{transform:scale(1.03)}
.win-body{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:20px 24px;border-top:1px solid var(--line)}
.win h3{font-size:clamp(22px,2.6vw,32px);margin-bottom:6px}
.win p{color:var(--muted);font-size:15px;max-width:44ch}
.win-cta{color:var(--accent);white-space:nowrap;font-weight:500}

/* about */
.about{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:48px;margin-top:40px}
.about p{color:var(--muted);max-width:52ch}
.rows{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow)}
.rows>*{display:flex;justify-content:space-between;gap:24px;padding:16px 20px;border-top:1px solid var(--line)}
.rows>:first-child{border-top:0}
.rows span:first-child{color:var(--muted)}
.rows span:last-child{text-align:right}

/* contact */
.contact-mail{display:inline-block;margin:8px 0 32px;font:600 clamp(24px,4vw,44px) var(--font-head);text-decoration:none;border-bottom:2px solid var(--accent);transition:color 200ms}
.contact-mail:hover{color:var(--accent)}
.socials{display:flex;gap:8px 24px;flex-wrap:wrap}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:14px}

/* category view */
.cat-top{padding:48px 0 40px}
.cat-top h1{font-size:clamp(36px,6vw,72px);margin:16px 0 12px;outline:0}
.cat-top p{color:var(--muted);max-width:56ch}
.works{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:dense;align-items:start;gap:16px;padding-bottom:48px}
.cat-foot{display:flex;justify-content:center;padding-bottom:96px}
.work{position:relative;display:block;width:100%;height:100%;padding:0;background:var(--card-2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;color:inherit;font:inherit;text-align:left;transition:transform 200ms,border-color 200ms}
.cell.big{grid-column:span 2;grid-row:span 2;aspect-ratio:auto;align-self:stretch}
.cell.nat,.work.nat{aspect-ratio:auto;height:auto}
.work.nat img{height:auto;object-fit:contain}
button.work{cursor:pointer}
.work img{width:100%;height:100%;object-fit:cover;transition:transform 300ms}
button.work:hover img{transform:scale(1.03)}
.ph{display:grid;place-items:center;height:100%;color:var(--muted);font:500 15px var(--font-head)}
.play{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--accent);transition:transform 200ms}
.play::after{content:"";position:absolute;left:22px;top:17px;border:11px solid transparent;border-left:17px solid var(--accent-ink);border-right:0}
button.work:hover .play{transform:scale(1.08)}
.work.playing{border-color:var(--line-hover)}
.work iframe{width:100%;height:100%;border:0;display:block}

/* quiet priority switch: easy for you to find, easy for visitors to miss */
#lead-wrap{position:fixed;right:12px;bottom:12px;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#lead-btn{width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;opacity:.18;transition:opacity 200ms}
#lead-btn:hover,#lead-btn:focus-visible,#lead-btn[aria-expanded="true"]{opacity:1}
#lead-btn i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
#lead-panel{background:var(--card);border:1px solid var(--line-hover);border-radius:var(--radius);box-shadow:0 4px 24px rgba(0,0,0,.5);padding:8px;min-width:220px}
#lead-panel p{color:var(--muted);font-size:13px;padding:6px 10px}
#lead-panel button{display:flex;align-items:center;width:100%;min-height:44px;padding:0 10px;background:none;border:0;border-radius:4px;color:var(--text);font:inherit;text-align:left;cursor:pointer}
#lead-panel button:hover{background:var(--card-2)}
#lead-panel button[aria-pressed="true"]{color:var(--accent)}
#lead-panel button[aria-pressed="true"]::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:10px}
#lead-panel button[aria-pressed="false"]::before{content:"";width:6px;margin-right:10px}

/* photo viewer */
dialog{margin:auto;max-width:min(1200px,94vw);max-height:92vh;background:var(--bg);border:1px solid var(--line-hover);border-radius:var(--radius);padding:0;color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.85)}
dialog img{max-width:100%;max-height:92vh;object-fit:contain}
dialog button{position:absolute;right:8px;top:8px;min-height:44px;padding:0 16px;background:var(--bg);color:var(--text);border:1px solid var(--line-hover);border-radius:var(--radius);cursor:pointer;font:inherit}

/* ===== v2: ambient background, light on hover, transitions ===== */
header{animation:fade 300ms var(--ease) backwards}
.glow::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:2;pointer-events:none;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),var(--glow),transparent 65%);opacity:0;transition:opacity 200ms var(--ease)}
.glow:hover::after{opacity:1}
.play{z-index:3}
.btn{position:relative;isolation:isolate}
.btn::after{content:"";position:absolute;inset:-6px;z-index:-1;pointer-events:none;border:1px solid var(--accent);border-radius:calc(var(--radius) + 5px);box-shadow:0 0 32px var(--glow);opacity:0;transform:scale(.94);transition:opacity 200ms var(--ease),transform 200ms var(--ease)}
.btn:hover::after,.btn:focus-visible::after{opacity:1;transform:scale(1)}
.rows a{text-decoration:none;transition:background 150ms}
.rows a:hover{background:var(--card-2)}
.work{animation:rise 300ms var(--ease) backwards;animation-delay:calc(250ms + var(--i,0) * 40ms)}
.portrait{aspect-ratio:4/5;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.portrait img{width:100%;height:100%;object-fit:cover}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:32px 0}
.stats div{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:16px 20px}
.stats b{display:block;font:600 36px/1.1 var(--font-head);color:var(--accent)}
.stats span{color:var(--muted);font-size:14px}
.sub{font-size:24px;margin:72px 0 24px}
/* ===== v4 ===== */
body.in-cat{--tint:color-mix(in srgb,var(--accent) 3%,transparent);--grid:color-mix(in srgb,var(--text) 1.2%,transparent);--bg-top:color-mix(in srgb,var(--text) 1.5%,var(--bg));--bg-bottom:color-mix(in srgb,#000 70%,var(--bg))}
.bg{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none;animation:fade 300ms var(--ease) backwards}
.bg>*{position:absolute;left:0;right:0;top:0;height:100%;will-change:transform}
.bg-fade{background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg) 42%,var(--bg-bottom) 100%)}
.bg-glow{background:radial-gradient(1100px 700px at 8% 3%,var(--tint),transparent 70%),radial-gradient(900px 700px at 96% 20%,var(--tint),transparent 70%),radial-gradient(1000px 700px at 4% 46%,var(--tint),transparent 70%),radial-gradient(900px 700px at 98% 70%,var(--tint),transparent 70%),radial-gradient(1000px 600px at 22% 96%,var(--tint),transparent 70%)}
.bg-grid{background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/48px 48px;-webkit-mask-image:linear-gradient(#000,transparent 90%);mask-image:linear-gradient(#000,transparent 90%)}
.hero-c{display:flex;flex-direction:column;align-items:center;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#logo{margin:8px 0 28px}
#logo:empty{display:none}
.logo{position:relative;display:inline-block;transition:transform 200ms var(--ease)}
.logo img{display:block;width:auto;height:clamp(200px,48vh,540px);max-width:94vw;object-fit:contain}
.logo img:last-child{position:relative}
.logo .lg{position:absolute;left:0;top:0;opacity:0;pointer-events:none;filter:drop-shadow(0 0 16px var(--accent)) drop-shadow(0 0 48px var(--glow));transition:opacity 200ms var(--ease)}
.logo:hover{transform:scale(1.06)}
.logo:hover .lg{opacity:1}
.back svg{transition:transform 200ms var(--ease)}
.back:hover svg{transform:translateX(-3px)}
.portrait-wrap{position:relative;transition:transform 200ms var(--ease)}
.portrait-wrap::before{content:"";position:absolute;inset:0;border-radius:var(--radius);box-shadow:0 0 0 1px var(--accent),0 0 44px var(--glow);opacity:0;transition:opacity 200ms var(--ease)}
.portrait-wrap .portrait{position:relative}
.portrait-wrap:hover{transform:scale(1.04)}
.portrait-wrap:hover::before{opacity:1}
@keyframes slide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.reveal{opacity:0}
.reveal.in{opacity:1;animation:slide 300ms var(--ease) backwards;animation-delay:calc(var(--r,0) * 30ms)}
.win::before,.cell::before{content:"";position:absolute;inset:-1px;z-index:-1;pointer-events:none;border-radius:calc(var(--radius) + 1px);box-shadow:0 0 0 1px var(--accent),0 0 40px var(--glow);opacity:0;transition:opacity 200ms var(--ease)}
.win:hover::before,.cell:hover::before{opacity:1}
.cell{position:relative;isolation:isolate;aspect-ratio:16/9;transition:transform 200ms var(--ease)}
.cell:hover{transform:translateY(-4px)}
.cell:has(.playing):hover{transform:none}
.cell:hover .work{border-color:var(--accent)}
.work-d{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;padding:12px 14px;background:var(--card);border:1px solid var(--line-hover);border-radius:var(--radius);box-shadow:0 6px 20px rgba(0,0,0,.5);opacity:0;transform:translateY(8px);transition:opacity 200ms var(--ease),transform 200ms var(--ease);pointer-events:none}
.work-d b{display:block;font:600 16px/1.3 var(--font-head)}
.work-d span{display:block;margin-top:4px;color:var(--muted);font-size:14px;line-height:1.5}
.cell:hover .work-d,.work:focus-visible .work-d{opacity:1;transform:none}
.win.wide{order:2;grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}
.win.wide .win-body{flex:1;border-top:0;padding:28px 32px}
.games{display:grid;gap:32px;padding-bottom:48px}
.game{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px;animation:rise 300ms var(--ease) backwards;animation-delay:calc(250ms + var(--i,0) * 60ms)}
.game h2{font-size:clamp(26px,3.4vw,40px);margin-bottom:24px}
.shots{display:grid;grid-template-columns:2fr 1fr;grid-auto-rows:clamp(110px,13vw,170px);gap:12px}
.shots>:first-child{grid-row:1/span var(--n,2)}
.shot{position:relative;display:block;width:100%;height:100%;padding:0;background:var(--card-2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;color:inherit;transition:transform 200ms var(--ease),border-color 200ms}
button.shot{cursor:pointer}
button.shot:hover{transform:translateY(-2px);border-color:var(--accent)}
.shot img{width:100%;height:100%;object-fit:cover;transition:transform 300ms}
button.shot:hover img{transform:scale(1.03)}
.game-info{display:grid;grid-template-columns:1fr auto;gap:24px 32px;align-items:end;margin-top:24px}
.game-info p{color:var(--muted);max-width:64ch}
.game-info .role{color:var(--text);margin-bottom:6px}
.game-info .role span{color:var(--accent);margin-right:10px;font-weight:500}
@media (max-width:860px){
  .win.wide{flex-direction:column;align-items:stretch}
  .game{padding:20px}
  .shots{grid-template-columns:1fr 1fr;grid-auto-rows:150px}
  .shots>:first-child{grid-column:1/-1;grid-row:auto;height:220px}
  .game-info{grid-template-columns:1fr}
}
@media (max-width:860px){.stats{grid-template-columns:1fr}.portrait{max-width:300px}}
.tools{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(var(--tool-w),1fr));gap:12px}
.tools li{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 8px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);color:var(--muted);transition:transform 200ms var(--ease),color 200ms,border-color 200ms}
.tools li::before{content:"";position:absolute;inset:-1px;z-index:-1;pointer-events:none;border-radius:calc(var(--radius) + 1px);box-shadow:0 0 0 1px var(--accent),0 0 32px var(--glow);opacity:0;transition:opacity 200ms var(--ease)}
.tools li:hover{transform:translateY(-3px);color:var(--accent);border-color:var(--accent)}
.tools li:hover::before{opacity:1}
.tools svg,.tools img,.tools .badge{width:var(--tool-icon);height:var(--tool-icon);flex:none}
.tools svg{fill:currentColor}
.tools img{object-fit:contain}
.tools .badge{display:grid;place-items:center;border:2px solid currentColor;border-radius:8px;font:600 calc(var(--tool-icon) * .4)/1 var(--font-head)}
.tools p{color:var(--text);font-size:13px;line-height:1.3;text-align:center}
::view-transition-group(*){animation-duration:550ms;animation-timing-function:cubic-bezier(.22,1,.36,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:350ms}

@media (max-width:860px){
  .wins,.about{grid-template-columns:1fr}
  .win.lead{min-height:340px}
  .works{grid-template-columns:1fr}
  .cell.big{grid-column:auto;grid-row:auto;aspect-ratio:16/9}
  .btn{width:100%;justify-content:center}
  .hero .row{flex-direction:column;align-items:stretch}
  section.block{padding:72px 0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="bg-fade"></div><div class="bg-glow" data-par=".35"></div><div class="bg-grid" data-par=".6"></div></div>
<a class="skip" href="#main">Skip to content</a>

<header>
  <div class="wrap">
    <a class="brand" href="#top" id="brand"></a>
    <nav aria-label="Main">
      <a href="#about">About</a>
      <a href="#work">Work</a>
      <a href="#games">Games</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main id="main">

  <!-- ============ HOME ============ -->
  <div id="home">
    <section class="hero" id="top">
      <div class="wrap hero-c">
        <p class="eyebrow" id="eyebrow" data-enter style="--d:0"></p>
        <div id="logo" data-enter style="--d:1"></div>
        <h1 id="headline" data-enter style="--d:1"></h1>
        <p id="intro" data-enter style="--d:2"></p>
        <div class="row" data-enter style="--d:3">
          <a class="btn" href="#work">View my work</a>
          <a class="link" href="#about">About me</a>
        </div>
      </div>
    </section>

    <section class="block" id="about">
      <div class="wrap">
        <h2>About</h2>
        <div class="about">
          <div class="portrait-wrap"><div class="portrait" id="portrait"></div></div>
          <div>
            <p id="about-text"></p>
            <div class="stats" id="stats"></div>

/* background parallax: layers move slower than the page */
const layers = [...document.querySelectorAll("[data-par]")];
function parMeasure() {
  const max = Math.max(0, document.documentElement.scrollHeight - innerHeight);
  layers.forEach(l => { const m = reduce ? 0 : +l.dataset.par * max; l.dataset.m = m; l.style.height = `calc(100% + ${m}px)`; });
  parUpdate();
}
function parUpdate() {
  layers.forEach(l => { const k = reduce ? 0 : +l.dataset.par; l.style.transform = `translate3d(0,${-l.dataset.m + k * scrollY}px,0)`; });
}
addEventListener("scroll", () => requestAnimationFrame(parUpdate), { passive: true });
addEventListener("resize", parMeasure);
new ResizeObserver(parMeasure).observe(document.body);

/* slide + fade when sections scroll into view */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });

  el.style.setProperty("--r", Math.min([...el.parentElement.children].indexOf(el), 6));
  el.classList.add("reveal");
  io.observe(el);
});

/* light that follows the pointer on windows and cards */
document.addEventListener("pointermove", e => {
  const g = e.target.closest && e.target.closest(".glow");
  if (!g) return;
  const r = g.getBoundingClientRect();
  g.style.setProperty("--mx", e.clientX - r.left + "px");
  g.style.setProperty("--my", e.clientY - r.top + "px");
});

/* routing: #env, #vfx, #ui open a category; anything else shows Home.

let started = false;
function route() {
  const id = location.hash.slice(1);

    $("#cat").hidden = !v;
    $("#lead-wrap").hidden = v;
    togglePanel(false);
    document.body.classList.toggle("in-cat", v);
    if (v) {
      if (c) renderCategory(c); else renderGames();
      $(".cat-top").style.viewTransitionName = "win-" + (c ? c.id : "games");
      window.scrollTo({ top: 0, behavior: "instant" });
      $("#cat-title").focus({ preventScroll: true });

      document.title = `${SITE.name} | Game Artist: 3D Environments, VFX and Game UI`;
      const target = id && document.getElementById(id);
      if (target) target.scrollIntoView({ behavior: "instant" }); else window.scrollTo({ top: 0, behavior: "instant" });
    }
